name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create Permanent Keystore (If not exists)
        run: |
          if [ ! -f app/mblive.jks ]; then
            echo "Generating new permanent keystore..."
            keytool -genkey -v -keystore app/mblive.jks -storepass mblive123 -alias mblive -keypass mblive123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MBLiveStudio, O=MB, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/mblive.jks
            git commit -m "Add permanent keystore to fix SHA-1"
            git push
          else
            echo "Permanent keystore already exists!"
          fi

      - name: Get Permanent SHA-1 Fingerprint
        if: always()
        run: |
          echo "====================================================="
          echo "HERE IS YOUR PERMANENT SHA-1 FINGERPRINT:"
          keytool -list -v -keystore app/mblive.jks -alias mblive -storepass mblive123 | grep "SHA1:"
          echo "====================================================="

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mblivestudio-apk
          path: app/build/outputs/apk/debug/*.apk
